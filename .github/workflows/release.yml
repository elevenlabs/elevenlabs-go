name: Release

# Runs only when a GitHub release is published, never on a push to main. Hand-written and listed in
# .fernignore: the generated workflow tagged and released on every push to main that touched go.mod.
#
# Go has no registry upload. The release's tag is the published version: proxy.golang.org and
# pkg.go.dev serve any semver tag once someone fetches it. This job checks the tag and asks the
# module proxy to fetch it, so the version is indexed straight away.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODULE: github.com/elevenlabs/elevenlabs-go
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the tag is a Go module version
        run: |
          if ! [[ "$TAG" =~ ^v1\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a v1 Go module version (v1.MINOR.PATCH)."
            exit 1
          fi

      - name: Ask the module proxy to fetch the version
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "https://proxy.golang.org/$MODULE/@v/$TAG.info"; then
              echo
              echo "::notice::$MODULE@$TAG is available from proxy.golang.org"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::proxy.golang.org did not return $MODULE@$TAG"
          exit 1
