name: Test
on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        run: |
          # Generated tests are expected here, so their absence is a failure rather than a skip:
          # an emitter regression must break the build, not print a friendly message and exit 0.
          if ! find . -name '*_test.go' -print -quit | grep -q .; then
            echo "::error::Expected generated *_test.go files, found none."
            exit 1
          fi

          set +e
          go test -count=1 -json ./... > test-events.json
          status=$?
          set -e

          # The runner's own verdict, exit status FIRST. Neither half is sufficient alone:
          #  - `go test` can exit 0 on packages that discovered nothing;
          #  - a json stream from a failed run still lists the tests it got through.
          if [ "$status" -ne 0 ]; then
            echo "::error::go test failed."
            cat test-events.json
            exit "$status"
          fi

          # Count passing top-level tests (no '/' in the name, so subtests are not counted twice):
          # the runner's own report of what ran and passed, not a count of files or symbols.
          # Each condition is its own grep so the count does not depend on the order of the event's keys.
          ran=$(grep -F '"Action":"pass"' test-events.json | grep -F '"Test":"' | grep -vc '"Test":"[^"]*/' || true)
          expected=3916
          # `-lt`, not `-ne`: the count guards against the EMITTER producing fewer tests than it
          # generated for. This workflow ships in the customer's repository, so tests they add
          # themselves push the total ABOVE the expected figure, and an exact match would fail a
          # build for the one thing we want people doing with a generated test project.
          if [ "$ran" -lt "$expected" ]; then
            echo "::error::Expected at least $expected generated test(s), $ran passed."
            exit 1
          fi
          echo "go test passed $ran of at least $expected expected test(s)."
